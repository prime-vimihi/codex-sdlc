name: Publish npm release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: macos-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Read package version
        id: package
        run: node -e "const pkg = require('./package.json'); console.log('spec=' + pkg.name + '@' + pkg.version)" >> "$GITHUB_OUTPUT"
      - name: Check whether this version is already published
        id: registry
        run: |
          if npm view "${{ steps.package.outputs.spec }}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish npm package with provenance
        if: steps.registry.outputs.published != 'true'
        run: npm publish --provenance
