<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc">
  <title id="title">From feature request to human acceptance</title>
  <desc id="desc">Four delivery stages: define requirements with PM and BA, build through backend and frontend roles, verify with independent QC, and decide with optional AI Product Owner advice and final human acceptance. A coordinator repository stores requirements, tasks, evidence, and decisions.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101e27"/>
      <stop offset="1" stop-color="#101820"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1078" height="428" rx="22" fill="url(#background)" stroke="#2a3c46" stroke-width="2"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
    <text x="44" y="45" fill="#63dfb5" font-size="13" font-weight="700" letter-spacing="2">THE DELIVERY LOOP</text>
    <text x="44" y="84" fill="#f5f7fa" font-size="30" font-weight="700">One request. A traceable delivery.</text>
    <text x="44" y="111" fill="#b4c4cc" font-size="17">One repository or many. Clear roles at every stage.</text>

    <g fill="none" stroke="#46d7a7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M273 232h27m-7-6 7 6-7 6M527 232h27m-7-6 7 6-7 6M781 232h27m-7-6 7 6-7 6"/>
    </g>
    <g fill="#16252e" stroke="#314752">
      <rect x="44" y="144" width="224" height="173" rx="14"/>
      <rect x="298" y="144" width="224" height="173" rx="14"/>
      <rect x="552" y="144" width="224" height="173" rx="14"/>
      <rect x="806" y="144" width="230" height="173" rx="14" stroke="#46d7a7"/>
    </g>

    <g fill="#63dfb5" font-size="13" font-weight="700" letter-spacing="1.5">
      <text x="64" y="174">01 / DEFINE</text>
      <text x="318" y="174">02 / BUILD</text>
      <text x="572" y="174">03 / VERIFY</text>
      <text x="826" y="174">04 / DECIDE</text>
    </g>
    <g fill="#f5f7fa" font-size="20" font-weight="650">
      <text x="64" y="211">Define the outcome</text>
      <text x="318" y="211">Build within scope</text>
      <text x="572" y="211">Verify the result</text>
      <text x="826" y="211">Make the decision</text>
    </g>
    <g fill="#b4c4cc" font-size="16">
      <text x="64" y="243">PM + business analysis</text>
      <text x="64" y="268">Requirements and criteria</text>
      <text x="318" y="243">Backend + frontend</text>
      <text x="318" y="268">Reviewed API contracts</text>
      <text x="572" y="243">Independent QC</text>
      <text x="572" y="268">Coverage, defects, retests</text>
      <text x="826" y="243">AI PO advice is optional</text>
      <text x="826" y="268">Human acceptance is final</text>
    </g>
    <g fill="#dbe8ee" font-size="13">
      <text x="64" y="297">PM reviews the handoff</text>
      <text x="318" y="297">PM integrates the work</text>
      <text x="572" y="297">Results recorded in the run</text>
      <text x="826" y="297">PM prepares the final package</text>
    </g>

    <path d="M44 343h992" stroke="#314752"/>
    <rect x="44" y="362" width="79" height="32" rx="7" fill="#203e38"/>
    <text x="83.5" y="384" text-anchor="middle" fill="#80e6c2" font-size="17" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">.sdlc/</text>
    <text x="139" y="382" fill="#f5f7fa" font-size="17" font-weight="600">Your coordinator keeps the record.</text>
    <text x="635" y="382" fill="#b4c4cc" font-size="16">Requirements · tasks · evidence · decisions</text>
  </g>
</svg>
